name: Full integration

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 1"

jobs:
  full-data-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d airflow-db warehouse
      - run: docker compose build airflow airflow-init
      - run: docker compose run --rm airflow-init
      - run: docker compose run --rm airflow python /opt/project/src/download_data.py
      - run: docker compose run --rm airflow python /opt/project/src/pipeline.py --full-refresh
      - run: |
          python - <<'PY'
          import json
          result = json.load(open("artifacts/run_summary.json", encoding="utf-8"))
          assert result["status"] == "success"
          assert result["source_rows"] == 541909
          assert result["warehouse_rows"] == 541907
          assert result["rejected_rows"] == 2
          PY
      - if: always()
        run: docker compose logs --no-color warehouse > warehouse.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-full-run
          path: |
            artifacts/
            warehouse.log
