name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas==2.1.4 openpyxl==3.1.5 "psycopg[binary]==3.2.6" pytest==8.3.5
      - run: python -m pytest -q
      - run: python -m py_compile src/*.py dags/*.py
      - run: docker compose config --quiet
