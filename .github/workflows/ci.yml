name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas==2.1.4 "psycopg[binary]==3.2.6" pytest==8.3.5
      - run: python -m pytest -q
      - run: docker compose config --quiet

